<a href="{{ get_url(path='/', lang=lang) }}" class="terminal-logo">
    <div class="crt-screen">
        <div class="scanlines"></div>
        <span id="typewriter"></span><span class="terminal-cursor">_</span>
    </div>
</a>

<script>
    const textElement = document.getElementById('typewriter');
    const phrases = ["Welcome to my blog  ^.^ ", "Hope you enjoy it <3"];
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typeSpeed = 100;

    function type() {
        const currentPhrase = phrases[phraseIndex];
        
        if (isDeleting) {
            // Đang xóa chữ
            textElement.textContent = currentPhrase.substring(0, charIndex - 1);
            charIndex--;
            typeSpeed = 50; // Xóa nhanh hơn gõ
        } else {
            // Đang gõ chữ
            textElement.textContent = currentPhrase.substring(0, charIndex + 1);
            charIndex++;
            typeSpeed = 100;
        }

        // Nếu gõ xong cụm từ
        if (!isDeleting && charIndex === currentPhrase.length) {
            isDeleting = true;
            typeSpeed = 2000; // Dừng lại 2 giây ở cuối mỗi câu để người dùng kịp đọc
        } 
        // Nếu xóa xong cụm từ
        else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            phraseIndex = (phraseIndex + 1) % phrases.length;
            typeSpeed = 500; // Nghỉ một chút trước khi bắt đầu gõ câu mới
        }

        setTimeout(type, typeSpeed);
    }

    // Khởi chạy khi trang web load xong
    document.addEventListener('DOMContentLoaded', type);
</script>
